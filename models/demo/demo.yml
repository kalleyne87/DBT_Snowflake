version: 2

models: 
  - name: employee
    description: "DBt Model for employee table"
    columns:
      - name: EMP_ID
        tests:
          - unique
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4 , 5]
              config:
                severity: warn
      - name: emp_salary
        tests:
          - value_check
  - name: customer
    description: "DBT model for customer"
  - name: customer_view
    description: "DBT model customer view"
  - name: sales
    description: "DBT model for sales table"
  - name: products
    description: "DBT model for product table"
  - name: purchase
    description: "DBT model for purchase table"
  - name: orders
    description: "DBT model for clean orders"
  - name: final_orders
    description: "Final orders model"
  - name: patient
    description: "Patient snapshot model"
  - name: session
    description: "DBT sessions model"
  - name: concat_address
    description: "DBT model for the address concat"
  - name: concat_name
    description: "DBT model for the name concat"

sources:
  - name: employee
    database: ANALYTICS
    schema: DBT_KALLEYNE
    tables:
      - name: EMPLOYEE_RAW
  - name: customer
    database: ANALYTICS
    schema: DBT_KALLEYNE
    tables:
      - name: CUSTOMER_SRC
  - name: sales
    database: ANALYTICS
    schema: DBT_KALLEYNE
    tables:
      - name: SALES_SRC
  - name: products
    database: ANALYTICS
    schema: DBT_KALLEYNE
    tables:
      - name: PRODUCT_SRC
  - name: purchase
    database: ANALYTICS
    schema: DBT_KALLEYNE
    tables:
      - name: PURCHASE_SRC
  - name: orders
    database: ANALYTICS
    schema: DBT_KALLEYNE
    tables:
      - name: BASIC_ORDERS
  - name: patient
    database: ANALYTICS
    schema: DBT_KALLEYNE
    tables:
      - name: PATIENT_SRC
  - name: session
    database: ANALYTICS
    schema: DBT_KALLEYNE
    tables:
      - name: SESSION_SRC