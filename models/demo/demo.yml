version: 2

models: 
  - name: employee
    description: "DBt Model for employee table"
    columns:
      - name: EMP_ID
        tests:
          - unique
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4 , 5]
              config:
                severity: warn
      - name: emp_salary
        tests:
          - value_check
  - name: customer
    description: "DBT model for customer"
  - name: customer_view
    description: "DBT model customer view"
  - name: sales
    description: "DBT model for sales table"

sources:
  - name: employee
    database: ANALYTICS
    schema: DBT_KALLEYNE
    tables:
      - name: EMPLOYEE_RAW
  - name: customer
    database: ANALYTICS
    schema: DBT_KALLEYNE
    tables:
      - name: CUSTOMER_SRC
  - name: sales
    database: ANALYTICS
    schema: DBT_KALLEYNE
    tables:
      - name: SALES_SRC
